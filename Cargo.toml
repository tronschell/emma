[workspace]
resolver = "2"
members = ["crates/core", "crates/ui", "crates/desktop"]
default-members = ["crates/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
emma-core = { path = "crates/core" }
emma-ui = { path = "crates/ui" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "7733b9922665f103abda7c6a3fde6b9dfdc8eba9", default-features = false }

