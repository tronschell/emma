name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: skip when this version is already released
        id: version
        run: |
          TAG="v$(node -p 'require("./package.json").version')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG is already released; bump the root package.json version on dev to publish again."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: require the Apple signing and notarization credentials
        if: steps.version.outputs.skip != 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for name in MACOS_CERT_P12 MACOS_CERT_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done

      - uses: actions/setup-node@v5
        if: steps.version.outputs.skip != 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: setup-zig v2.2.1
        if: steps.version.outputs.skip != 'true'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0

      - if: steps.version.outputs.skip != 'true'
        run: npm ci
        working-directory: desktop

      - if: steps.version.outputs.skip != 'true'
        run: npm run package:mac

      - name: import the Developer ID Application certificate
        if: steps.version.outputs.skip != 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          umask 077
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/emma-cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/emma-signing.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/emma-signing.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/emma-signing.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/emma-signing.keychain-db" login.keychain-db
          security import "$RUNNER_TEMP/emma-cert.p12" -k "$RUNNER_TEMP/emma-signing.keychain-db" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/emma-signing.keychain-db"
          security find-identity -v -p codesigning "$RUNNER_TEMP/emma-signing.keychain-db" | grep 'Developer ID Application:'

      - name: sign and verify the app and all native helpers
        if: steps.version.outputs.skip != 'true'
        working-directory: desktop
        run: |
          npx --no-install electron-osx-sign release/Emma-darwin-arm64/Emma.app
          codesign --verify --deep --strict --verbose=2 release/Emma-darwin-arm64/Emma.app

      - name: notarize, staple, and verify Gatekeeper acceptance
        if: steps.version.outputs.skip != 'true'
        env:
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          umask 077
          printf '%s' "$API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/emma-api-key.p8"
          ditto -c -k --keepParent desktop/release/Emma-darwin-arm64/Emma.app "$RUNNER_TEMP/emma-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/emma-notarize.zip" --key "$RUNNER_TEMP/emma-api-key.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER" --wait --timeout 20m --output-format json > "$RUNNER_TEMP/emma-notary-result.json"
          if ! jq -e '.status == "Accepted"' "$RUNNER_TEMP/emma-notary-result.json"; then
            xcrun notarytool log "$(jq -r '.id' "$RUNNER_TEMP/emma-notary-result.json")" --key "$RUNNER_TEMP/emma-api-key.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER"
            exit 1
          fi
          xcrun stapler staple desktop/release/Emma-darwin-arm64/Emma.app
          xcrun stapler validate desktop/release/Emma-darwin-arm64/Emma.app
          spctl --assess --type execute --verbose=2 desktop/release/Emma-darwin-arm64/Emma.app

      - name: build, sign, notarize and staple the disk image
        if: steps.version.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          umask 077
          npm run dmg:mac
          DMG="desktop/release/Emma-$TAG-darwin-arm64.dmg"
          IDENTITY="$(security find-identity -v -p codesigning "$RUNNER_TEMP/emma-signing.keychain-db" | awk -F'"' '/Developer ID Application:/ { print $2; exit }')"
          codesign --sign "$IDENTITY" --keychain "$RUNNER_TEMP/emma-signing.keychain-db" --timestamp --force "$DMG"
          codesign --verify --strict --verbose=2 "$DMG"
          xcrun notarytool submit "$DMG" --key "$RUNNER_TEMP/emma-api-key.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER" --wait --timeout 20m --output-format json > "$RUNNER_TEMP/emma-dmg-notary-result.json"
          if ! jq -e '.status == "Accepted"' "$RUNNER_TEMP/emma-dmg-notary-result.json"; then
            xcrun notarytool log "$(jq -r '.id' "$RUNNER_TEMP/emma-dmg-notary-result.json")" --key "$RUNNER_TEMP/emma-api-key.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER"
            exit 1
          fi
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"

      - name: publish the release with generated notes
        if: steps.version.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          ditto -c -k --keepParent desktop/release/Emma-darwin-arm64/Emma.app "Emma-$TAG-darwin-arm64.zip"
          cp "desktop/release/Emma-$TAG-darwin-arm64.dmg" "Emma-$TAG-darwin-arm64.dmg"
          shasum -a 256 "Emma-$TAG-darwin-arm64.zip" > "Emma-$TAG-darwin-arm64.zip.sha256"
          shasum -a 256 "Emma-$TAG-darwin-arm64.dmg" > "Emma-$TAG-darwin-arm64.dmg.sha256"
          gh release create "$TAG" "Emma-$TAG-darwin-arm64.dmg" "Emma-$TAG-darwin-arm64.dmg.sha256" "Emma-$TAG-darwin-arm64.zip" "Emma-$TAG-darwin-arm64.zip.sha256" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes --latest

      - name: remove the temporary signing credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/emma-cert.p12" "$RUNNER_TEMP/emma-api-key.p8" "$RUNNER_TEMP/emma-notarize.zip" "$RUNNER_TEMP/emma-notary-result.json" "$RUNNER_TEMP/emma-dmg-notary-result.json"
          if [ -f "$RUNNER_TEMP/emma-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/emma-signing.keychain-db"
          fi
