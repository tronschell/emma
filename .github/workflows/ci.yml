name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: cargo-check-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-check-${{ runner.os }}-${{ runner.arch }}-

      - run: npm ci
        working-directory: desktop

      - run: npm run check
        working-directory: desktop

      - name: build native helpers
        if: github.event_name == 'pull_request' && github.base_ref != 'main'
        run: npm run build:native
        working-directory: desktop

      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked --all-targets
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings

  zig:
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: setup-zig v2.2.1
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0

      - run: zig build test
        working-directory: harness

  package_mac:
    name: package-mac
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: macos-15
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: setup-zig v2.2.1
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: cargo-package-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-package-${{ runner.os }}-${{ runner.arch }}-

      - run: npm ci
        working-directory: desktop

      - run: npm run package:mac

      - name: archive the release candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p "$RUNNER_TEMP/emma-release-candidate"
          ditto -c -k --keepParent desktop/release/Emma-darwin-arm64 "$RUNNER_TEMP/emma-release-candidate/Emma-darwin-arm64.zip"

      - name: checksum the release candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd "$RUNNER_TEMP/emma-release-candidate"
          shasum -a 256 Emma-darwin-arm64.zip > Emma-darwin-arm64.zip.sha256

      - name: write the release candidate manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: printf '{"source_sha":"%s","version":"%s","workflow_run_id":"%s"}\n' "$GITHUB_SHA" "$(node -p 'require("./package.json").version')" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/emma-release-candidate/manifest.json"

      - name: upload the release candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: emma-release-candidate
          path: ${{ runner.temp }}/emma-release-candidate
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  check:
    if: github.event_name == 'pull_request' && always()
    needs:
      - macos
      - zig
      - package_mac
      - check-windows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: require all PR checks
        run: |
          test "${{ needs.macos.result }}" = success
          test "${{ needs.zig.result }}" = success
          test "${{ needs.check-windows.result }}" = success
          test "${{ needs.package_mac.result }}" = "${{ github.base_ref == 'main' && 'success' || 'skipped' }}"

  check-windows:
    if: github.event_name == 'pull_request' && always()
    needs:
      - windows
      - zig_windows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: require all Windows checks
        run: |
          test "${{ needs.windows.result }}" = success
          test "${{ needs.zig_windows.result }}" = success

  windows:
    if: github.event_name == 'pull_request'
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/cache@v5
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-

      - run: npm ci
        working-directory: desktop

      - run: npm run build:main
        working-directory: desktop

      - run: node --test --test-timeout=60000 dist-main/test/background.test.js test/windows.test.mjs
        working-directory: desktop

      - run: npm run build:native
        working-directory: desktop

      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings

  zig_windows:
    name: zig-windows
    if: github.event_name == 'pull_request'
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: setup-zig v2.2.1
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0

      - run: zig build test
        working-directory: harness
