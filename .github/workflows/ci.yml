name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      package:
        description: Build and install-smoke the macOS and Windows packages on this ref
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: cargo-check-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-check-${{ runner.os }}-${{ runner.arch }}-

      - run: npm ci
        working-directory: desktop

      - run: npm run check
        working-directory: desktop

      - name: build native helpers
        if: github.event_name == 'pull_request' && github.base_ref != 'main'
        run: npm run build:native
        working-directory: desktop

      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked --all-targets
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings

  zig:
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: setup-zig v2.2.1
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0

      - run: zig build test
        working-directory: harness

  package_mac:
    name: package-mac
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'workflow_dispatch' && inputs.package)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: setup-zig v2.2.1
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: cargo-package-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-package-${{ runner.os }}-${{ runner.arch }}-

      - run: npm ci
        working-directory: desktop

      - run: npm run package:mac

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: npm run dmg:mac

      - name: install and launch the macOS package
        run: |
          version=$(node -p "require('./package.json').version")
          image="desktop/release/Emma-v$version-darwin-arm64.dmg"
          test -f "$image"
          mount="$RUNNER_TEMP/emma-install-smoke-image"
          copy="$RUNNER_TEMP/Applications"
          rm -rf "$mount" "$copy"
          mkdir -p "$mount" "$copy"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$image"
          ditto "$mount/Emma.app" "$copy/Emma.app"
          hdiutil detach "$mount" || hdiutil detach "$mount" -force
          node desktop/scripts/install-smoke.mjs "$copy/Emma.app/Contents/MacOS/Emma" "$RUNNER_TEMP/emma-install-smoke-shot/macos.png"
          rm -rf "$copy/Emma.app"

      - name: upload the macOS install smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-smoke-macos
          path: ${{ runner.temp }}/emma-install-smoke-shot/macos.png
          retention-days: 3
          if-no-files-found: warn

      - name: archive the release candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p "$RUNNER_TEMP/emma-release-candidate"
          ditto -c -k --keepParent desktop/release/Emma-darwin-arm64 "$RUNNER_TEMP/emma-release-candidate/Emma-darwin-arm64.zip"

      - name: checksum the release candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd "$RUNNER_TEMP/emma-release-candidate"
          shasum -a 256 Emma-darwin-arm64.zip > Emma-darwin-arm64.zip.sha256

      - name: write the release candidate manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: printf '{"source_sha":"%s","version":"%s","workflow_run_id":"%s"}\n' "$GITHUB_SHA" "$(node -p 'require("./package.json").version')" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/emma-release-candidate/manifest.json"

      - name: upload the release candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: emma-release-candidate
          path: ${{ runner.temp }}/emma-release-candidate
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  check:
    if: github.event_name == 'pull_request' && always()
    needs:
      - macos
      - zig
      - package_mac
      - package_win
      - check-windows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: require all PR checks
        run: |
          test "${{ needs.macos.result }}" = success
          test "${{ needs.zig.result }}" = success
          test "${{ needs.check-windows.result }}" = success
          test "${{ needs.package_mac.result }}" = "${{ github.base_ref == 'main' && 'success' || 'skipped' }}"
          test "${{ needs.package_win.result }}" = "${{ github.base_ref == 'main' && 'success' || 'skipped' }}"

  check-windows:
    if: github.event_name == 'pull_request' && always()
    needs:
      - windows
      - zig_windows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: require all Windows checks
        run: |
          test "${{ needs.windows.result }}" = success
          test "${{ needs.zig_windows.result }}" = success

  windows:
    if: github.event_name == 'pull_request'
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/cache@v5
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-

      - run: npm ci
        working-directory: desktop

      - run: npm run test
        working-directory: desktop

      - name: msvc-dev-cmd v1.13.0
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: amd64

      - run: npm run build:native
        working-directory: desktop

      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings

  zig_windows:
    name: zig-windows
    if: github.event_name == 'pull_request'
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: setup-zig v2.2.1
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0

      - run: zig build test --test-timeout 2m --summary all
        working-directory: harness

  package_win:
    name: package-win
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'workflow_dispatch' && inputs.package)
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: setup-zig v2.2.1
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0

      - uses: actions/cache@v5
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target\release
          key: cargo-package-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-package-${{ runner.os }}-${{ runner.arch }}-

      - name: msvc-dev-cmd v1.13.0
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: amd64

      - run: npm ci
        working-directory: desktop

      - name: stage the Windows signing certificate
        id: certificate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:CERT_PFX_BASE64 -or -not $env:CERT_PASSWORD) {
            Write-Output 'Packaging Windows unsigned. Add WINDOWS_CERT_PFX_BASE64 and WINDOWS_CERT_PASSWORD to sign it.'
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'emma-cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX_BASE64))
          "pfx=$pfx" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: package the Windows release candidate
        env:
          WINDOWS_CERT_PFX: ${{ steps.certificate.outputs.pfx }}
          WINDOWS_CERT_PASSWORD: ${{ steps.certificate.outputs.pfx != '' && secrets.WINDOWS_CERT_PASSWORD || '' }}
        run: npm run package:win

      - name: install and launch the Windows package
        run: |
          $version = node -p "require('./package.json').version"
          $setup = Join-Path (Get-Location) "desktop/release/squirrel/Emma-$version-win32-x64-Setup.exe"
          if (-not (Test-Path $setup)) { throw "Missing installer: $setup" }
          Start-Process -FilePath $setup -ArgumentList '-s' -Wait
          $root = Join-Path $env:LOCALAPPDATA 'Emma'
          $installed = Join-Path $root "app-$version"
          $exe = Join-Path $installed 'Emma.exe'
          $updater = Join-Path $root 'Update.exe'
          $deadline = (Get-Date).AddMinutes(5)
          while (-not ((Test-Path $exe) -and (Test-Path $updater)) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if (-not (Test-Path $exe)) { throw "Missing installed app: $exe" }
          if (-not (Test-Path $updater)) { throw "Missing updater: $updater" }
          $programs = Join-Path $env:APPDATA 'Microsoft/Windows/Start Menu/Programs'
          $shortcut = Get-ChildItem -Path $programs -Recurse -Filter 'Emma.lnk' | Select-Object -First 1
          if (-not $shortcut) { throw "Missing Start Menu shortcut under $programs" }
          Write-Output "Installed $exe with shortcut $($shortcut.FullName)"
          Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -like "$root*" } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          node desktop/scripts/install-smoke.mjs "$exe" (Join-Path $env:RUNNER_TEMP 'emma-install-smoke-shot/windows.png')

      - name: uninstall the Windows package
        run: |
          $version = node -p "require('./package.json').version"
          $root = Join-Path $env:LOCALAPPDATA 'Emma'
          $installed = Join-Path $root "app-$version"
          Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -like "$root*" } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Start-Process -FilePath (Join-Path $root 'Update.exe') -ArgumentList '--uninstall', '-s'
          $deadline = (Get-Date).AddMinutes(5)
          while ((Test-Path $installed) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if (Test-Path $installed) {
            Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -like "$root*" } | Format-Table ProcessId, ExecutablePath
            Get-ChildItem -Path $root -Filter '*.log' | ForEach-Object { Write-Output $_.FullName; Get-Content $_.FullName -Tail 40 }
            throw "Uninstall left $installed behind"
          }
          Write-Output "Uninstalled $installed"

      - name: upload the Windows install smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-smoke-windows
          path: ${{ runner.temp }}/emma-install-smoke-shot/windows.png
          retention-days: 3
          if-no-files-found: warn

      - name: stage the Windows release candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          $candidate = Join-Path $env:RUNNER_TEMP 'emma-release-candidate-windows'
          New-Item -ItemType Directory -Force -Path $candidate | Out-Null
          $feed = @('RELEASES', 'SHA256SUMS')
          Get-ChildItem -Path desktop/release/squirrel -File |
            Where-Object { $feed -contains $_.Name -or $_.Extension -eq '.nupkg' -or $_.Name -like 'Emma-*-Setup.exe' } |
            Copy-Item -Destination $candidate
          node -e "require('node:fs').writeFileSync(process.argv[1], JSON.stringify({ source_sha: process.env.GITHUB_SHA, version: require('./package.json').version, workflow_run_id: process.env.GITHUB_RUN_ID }) + '\n')" "$candidate/manifest.json"

      - name: upload the Windows release candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: emma-release-candidate-windows
          path: ${{ runner.temp }}/emma-release-candidate-windows
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

      - name: remove the Windows signing certificate
        if: always()
        run: Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP 'emma-cert.pfx')
